  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   OPTIIIMUM — HOME PAGE\n   Bilingual (EN / AR · LTR / RTL) · Light & dark themes\n   ============================================================ */\n\n:root {\n  /* Brand spectrum */\n  --grad-1: #FDD196;\n  --grad-2: #FF966D;\n  --grad-3: #E555C8;\n  --grad-4: #BE6FD2;\n  --grad-5: #54B3EC;\n  --grad-6: #00FEFF;\n\n  /* Light theme tokens (default) */\n  --bg:           #FAFAF7;\n  --bg-band:     #F1EFE9;\n  --bg-elev:     #FFFFFF;\n  --ink:         #0A0A0A;\n  --ink-2:       #3D3D3A;\n  --ink-3:       #7A7770;\n  --line:        #E6E3DB;\n  --line-strong: #C9C5BB;\n  --cta:         #0A0A0A;\n  --cta-ink:     #FAFAF7;\n  --accent:      #E555C8;\n  --shadow-1:    0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);\n  --shadow-2:    0 1px 2px rgba(0,0,0,.04), 0 22px 48px rgba(0,0,0,.08);\n  --logo-mono:   #1F1F1F;\n  --glow:        rgba(229,85,200,.18);\n\n  --r-sm: 8px;\n  --r:    14px;\n  --r-lg: 22px;\n  --r-xl: 32px;\n\n  --maxw: 1280px;\n  --pad:  clamp(20px, 4vw, 56px);\n\n  /* Typography system — futuristic premium\n     Display:  Space Grotesk 600/700  (futuristic geometric sans)\n     Body:     Space Grotesk 400/500\n     Accent:   Instrument Serif italic — used ONLY on .alt highlight words\n     Mono:     JetBrains Mono — labels, eyebrows, numerics\n     Arabic:   IBM Plex Sans Arabic — premium modern Arabic */\n  --font-sans: \"DM Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n  --font-display: \"Instrument Serif\", Georgia, serif;\n  --font-serif: \"Instrument Serif\", Georgia, serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  --font-ar: \"IBM Plex Sans Arabic\", \"Tajawal\", \"Segoe UI\", Tahoma, sans-serif;\n\n  --tr-display: -.005em;\n  --tr-tight: -.005em;\n  --tr-mono: .14em;\n}\n\n[data-theme=\"dark\"] {\n  --bg:           #0B0B0B;\n  --bg-band:     #141413;\n  --bg-elev:     #161616;\n  /* Text rule: WHITE · GRADIENT · LIGHT GREY only */\n  --ink:         #FFFFFF;       /* white */\n  --ink-2:       #D4D4D8;       /* light grey */\n  --ink-3:       #A1A1AA;       /* light grey (softer) */\n  --line:        #2A2A28;\n  --line-strong: #3A3A36;\n  --cta:         #FFFFFF;\n  --cta-ink:     #0B0B0B;\n  --accent:      #FF8FE0;\n  --shadow-1:    0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);\n  --shadow-2:    0 1px 2px rgba(0,0,0,.4), 0 28px 60px rgba(0,0,0,.55);\n  --logo-mono:   #B8B5AE;\n  --glow:        rgba(229,85,200,.28);\n}\n\n/* ============================================================\n   TEXT COLOR RULE (dark theme)\n   All written text must be one of:\n     · white         (.text-white / default body)\n     · light grey    (.text-mute / --ink-2 / --ink-3)\n     · brand gradient (.text-grad / .alt)\n   No dark text on light pills allowed.\n   ============================================================ */\n[data-theme=\"dark\"] .text-grad,\n[data-theme=\"dark\"] .grad-text,\n[data-theme=\"dark\"] .alt {\n  background: linear-gradient(120deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4), var(--grad-5), var(--grad-6));\n  -webkit-background-clip: text; background-clip: text;\n  color: transparent;\n  -webkit-text-fill-color: transparent;\n}\n[data-theme=\"dark\"] .text-white { color: #FFFFFF !important; }\n[data-theme=\"dark\"] .text-mute  { color: var(--ink-2) !important; }\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0; padding: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  transition: background-color .25s ease, color .25s ease;\n}\n\nhtml[lang=\"ar\"] { font-family: var(--font-ar); line-height: 1.7; }\nhtml[lang=\"ar\"] body { font-family: var(--font-ar); }\n\na { color: inherit; text-decoration: none; }\n\nimg { display: block; max-width: 100%; }\n\n/* ============= i18n visibility ============= */\nhtml[lang=\"en\"] .i18n-ar { display: none !important; }\nhtml[lang=\"ar\"] .i18n-en { display: none !important; }\n\n/* ============================================================\n   LAYOUT PRIMITIVES\n   ============================================================ */\n.container { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }\n\n.section { padding: clamp(64px, 9vw, 120px) 0; }\n.section + .section { border-top: 1px solid var(--line); }\n.section.band { background: var(--bg-band); }\n\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: .14em;\n  color: var(--ink-3);\n}\nhtml[lang=\"ar\"] .eyebrow { font-family: var(--font-mono); letter-spacing: .08em; }\n\nh1, h2, h3 {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  letter-spacing: -.022em;\n  line-height: 1.02;\n  margin: 0;\n  text-wrap: balance;\n}\nh1 { font-weight: 700; }\nh2 { font-weight: 700; }\nh3 { font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }\nhtml[lang=\"ar\"] h1, html[lang=\"ar\"] h2, html[lang=\"ar\"] h3 {\n  font-family: var(--font-ar); font-weight: 700; line-height: 1.25; letter-spacing: 0;\n}\n\nh1 { font-size: clamp(40px, 7vw, 88px); text-wrap: balance; }\nh2 { font-size: clamp(32px, 5vw, 56px); text-wrap: balance; }\nh3 { font-size: clamp(22px, 2.4vw, 30px); }\n\n.lede { color: var(--ink-2); font-size: clamp(16px, 1.4vw, 19px); max-width: 62ch; text-wrap: pretty; }\n\n/* Buttons */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 14px 22px; border-radius: 999px;\n  font: inherit; font-weight: 500; font-size: 14.5px;\n  cursor: pointer; border: 1px solid transparent;\n  transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;  #FFFFFF; border-color: #2A2A28; }\n.chip.miss { background: rgba(229,85,200,.08); color: var(--accent); border-color: rgba(229,85,200,.3); }\n\n/* ============================================================\n   HEADER — floating pill topbar with gradient wordmark + CTA\n   ============================================================ */\n.topbar {\n  position: sticky; top: 16px; z-index: 50;\n  background: transparent;\n  backdrop-filter: none;\n  border: 0;\n  padding: 0 var(--pad);\n  margin-top: 16px;\n}\n.topbar > .container { padding: 0; }\n.topbar-inner {\n  display: flex; align-items: center; gap: 14px;\n  padding: 8px 8px 8px 22px;\n  background: #0E0E0E;\n  border: 1px solid rgba(255,255,255,.08);\n  border-radius: 999px;\n  box-shadow: 0 10px 30px rgba(0,0,0,.45);\n}\n[data-theme=\"light\"] .topbar-inner {\n  background: #FFFFFF;\n  border-color: rgba(0,0,0,.08);\n  box-shadow: 0 10px 30px rgba(0,0,0,.06);\n}\n\n/* Wordmark — official logo (image with CSS mask for color variants) */\n.brand-link {\n  display: inline-flex; align-items: center; gap: 0;\n  border: 0; padding: 4px 0; margin-inline-end: 10px;\n  line-height: 1;\n}\n.brand-mark { display: none; }\n.brand-name {\n  display: inline-block;\n  width: clamp(110px, 9vw, 150px);\n  aspect-ratio: 738 / 118;\n  background: linear-gradient(95deg,\n    #FDD196 0%, #FF966D 16%, #E555C8 36%,\n    #BE6FD2 54%, #54B3EC 72%, #00FEFF 92%);\n  -webkit-mask: url(\"b1d91275-24d5-4682-846e-31d3d7220d1b\") left center / contain no-repeat;\n          mask: url(\"b1d91275-24d5-4682-846e-31d3d7220d1b\") left center / contain no-repeat;\n  /* hide any inner text (legacy markup) */\n  font-size: 0; color: transparent;\n}\n.brand-name .dot, .brand-name .tm { display: none; }\n.brand-name--white { background: #FFFFFF; }\n.brand-name--black { background: #0A0A0A; }\n.foot-col .brand-name { width: clamp(140px, 11vw, 180px); }\n\n/* Primary nav inside the pill */\n.primary-nav {\n  display: flex; align-items: center; gap: 1px
