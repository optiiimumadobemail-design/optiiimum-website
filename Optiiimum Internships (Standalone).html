=================\n   CULTURE STRIP REFINEMENT — compact, face-safe, premium\n   Overrides earlier .culture-strip defaults for less wasted\n   space + better face framing on every photo.\n   ============================================================ */\n#team .section-head { gap: 32px; align-items: end; }\n#team .section-head > div { max-width: 56ch; }\n#team .section-head .right { font-size: 15px; line-height: 1.55; color: var(--ink-2); max-width: 38ch; }\n\n.culture-strip {\n  /* Tighter editorial bento — 4 columns, denser rows */\n  grid-template-columns: 1.5fr 1fr 1fr 1fr;\n  grid-template-rows: 180px 180px;\n  gap: 12px;\n  margin: 40px 0 28px;\n}\n.cs-card {\n  border-radius: 18px;\n  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s;\n}\n.cs-card:hover {\n  transform: translateY(-3px);\n  box-shadow: 0 18px 44px -22px rgba(229,85,200,.4), 0 6px 16px -8px rgba(0,0,0,.25);\n}\n/* Soft brand gradient border on hover — matches ambassadors */\n.cs-card::before {\n  content: \"\"; position: absolute; inset: -1px;\n  border-radius: inherit;\n  padding: 1px;\n  background: linear-gradient(135deg, #FDD196, #FF966D, #E555C8, #BE6FD2, #54B3EC, #00FEFF);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor; mask-composite: exclude;\n  opacity: 0;\n  transition: opacity .35s ease;\n  pointer-events: none;\n  z-index: 3;\n}\n.cs-card:hover::before { opacity: .85; }\n\n/* Face-safe framing — eyes/upper-third visible across every photo */\n.cs-card img {\n  object-position: 50% 28%;\n}\n.cs-card.cs-lg img { object-position: 50% 32%; }\n.cs-card.cs-tall img { object-position: 50% 22%; }\n\n/* Editorial bento spans on desktop */\n.cs-card.cs-lg   { grid-row: span 2; grid-column: span 2; }\n.cs-card.cs-tall { grid-row: span 2; }\n\n/* Smaller, less-intrusive figcaption pill */\n.cs-card figcaption {\n  left: 12px; right: 12px; bottom: 12px;\n  padding: 8px 12px;\n  border-radius: 12px;\n  background: rgba(11,11,11,.55);\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n  border: 1px solid rgba(255,255,255,.12);\n}\n.cs-card .cs-name { font-size: 14px; line-height: 1.2; }\n.cs-card.cs-lg .cs-name { font-size: 18px; }\n.cs-card .cs-role { font-size: 10px; }\n\n/* Inside-grid (departments) — tighten */\n.inside-grid { margin-top: 32px; gap: 10px; }\n.dept { padding: 14px 16px; }\n\n@media (max-width: 1080px) {\n  .culture-strip {\n    grid-template-columns: 1fr 1fr 1fr;\n    grid-template-rows: 200px 200px;\n  }\n  .cs-card.cs-lg   { grid-row: span 2; grid-column: span 2; }\n  .cs-card.cs-tall { grid-row: span 1; grid-column: span 1; }\n  .cs-card:nth-child(6) { display: none; }\n}\n@media (max-width: 920px) {\n  .culture-strip {\n    grid-template-columns: 1fr 1fr;\n    grid-template-rows: 200px 200px 200px;\n  }\n  .cs-card.cs-lg   { grid-row: span 1; grid-column: span 2; }\n  .cs-card.cs-tall { grid-row: span 1; grid-column: span 1; }\n  .cs-card:nth-child(6) { display: block; }\n}\n@media (max-width: 560px) {\n  .culture-strip {\n    grid-template-columns: 1fr 1fr;\n    grid-template-rows: repeat(3, 160px);\n    gap: 10px;\n  }\n  .cs-card.cs-lg { grid-column: span 2; }\n  .cs-card .cs-name { font-size: 13px; }\n  .cs-card.cs-lg .cs-name { font-size: 16px; }\n}\n\n/* ============================================================\n   NAV SLIDER + CONTENT CAROUSELS — rail wrapper, arrows\n   Activated by slider.js wrapping target elements.\n   ============================================================ */\n\n/* Allow the primary nav to scroll horizontally and persist down\n   to ~860px instead of being hidden at 1024px. */\n.primary-nav {\n  overflow-x: auto !important;\n  overflow-y: hidden !important;\n  scrollbar-width: none;\n  -ms-overflow-style: none;\n  flex-wrap: nowrap;\n  scroll-behavior: smooth;\n}\n.primary-nav::-webkit-scrollbar { display: none; }\n\n/* Rail wrapper sits in the same flex slot the original element\n   occupied, so layout stays intact. */\n.rail-wrap {\n  position: relative;\n  flex: 1 1 auto;\n  min-width: 0;\n}\n.rail-wrap.rail-nav { margin: 0 auto; max-width: 100%; }\n\n.rail-scroller {\n  -webkit-overflow-scrolling: touch;\n}\n\n/* Edge-fade masks on overflow — keeps cut tabs/cards feeling\n   intentional rather than chopped. */\n.rail-wrap.has-overflow::before,\n.rail-wrap.has-overflow::after {\n  content: \"\";\n  position: absolute; top: 0; bottom: 0;\n  width: 36px;\n  pointer-events: none;\n  z-index: 2;\n}\n.rail-content.has-overflow::before,\n.rail-content.has-overflow::after { width: 56px; }\n.rail-wrap.has-overflow::before { left: 0;\n  background: linear-gradient(90deg, var(--bg) 0%, transparent 100%); }\n.rail-wrap.has-overflow::after  { right: 0;\n  background: linear-gradient(-90deg, var(--bg) 0%, transparent 100%); }\n.section.band .rail-wrap.has-overflow::before { background: linear-gradient(90deg, var(--bg-band) 0%, transparent 100%); }\n.section.band .rail-wrap.has-overflow::after  { background: linear-gradient(-90deg, var(--bg-band) 0%, transparent 100%); }\n/* Nav rail edge fade should match the pill background, not page bg */\n.rail-nav.has-overflow::before,\n.rail-nav.has-overflow::after { width: 22px; }\n.rail-nav.has-overflow::before { background: linear-gradient(90deg, #0F0F0F 0%, transparent 100%); }\n.rail-nav.has-overflow::after  { background: linear-gradient(-90deg, #0F0F0F 0%, transparent 100%); }\n[data-theme=\"light\"] .rail-nav.has-overflow::before { background: linear-gradient(90deg, #FFFFFF 0%, transparent 100%); }\n[data-theme=\"light\"] .rail-nav.has-overflow::after  { background: linear-gradient(-90deg, #FFFFFF 0%, transparent 100%); }\nhtml[dir=\"rtl\"] .rail-wrap.has-overflow::before,\nhtml[dir=\"rtl\"] .rail-wrap.has-overflow::after {\n  background: linear-gradient(90deg, var(--bg) 0%, transparent 100%);\n}\nhtml[dir=\"rtl\"] .section.band .rail-wrap.has-overflow::before,\nhtml[dir=\"rtl\"] .section.band .rail-wrap.has-overflow::after {\n  background: linear-gradient(90deg, var(--bg-band) 0%, transparent 100%);\n}\n\n/* Arrow buttons — small, elegant, premium */\n.rail-arrow {\n  position: absolute;\n  top: 50%;\n  width: 36px; height: 36px;\n  display: grid; place-items: center;\n  border-radius: 50%;\n  background: var(--bg-elev);\n  border: 1px solid var(--line);\n  color: var(--ink);\n  cursor: pointer;\n  z-index: 6;\n  transform: translateY(-50%);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .25s, border-color .25s, background .25s, transform .25s ease;\n  box-shadow: 0 6px 18px -6px rgba(0,0,0,.25);\n}\n[data-theme=\"dark\"] .rail-arrow {\n  background: rgba(28,28,28,.92);\n  border-color: rgba(255,255,255,.12);\n  color: #FFFFFF;\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n}\n.rail-wrap.has-overflow .rail-arrow { opacity: 1; pointer-events: auto; }\n.rail-arrow:hover {\n  transform: translateY(-50%) scale(1.08);\n  border-color: rgba(229,85,200,.5);\n  color: var(--ink);\n}\n.rail-arrow:focus-visible {\n  outline: 2px solid rgba(229,85,200,.55);\n  outline-offset: 3px;\n}\n.rail-arrow.is-disabled { opacity: 0; pointer-events: none; }\n.rail-arrow-prev { left: -14px; }\n.rail-arrow-next { right: -14px; }\nhtml[dir=\"rtl\"] .rail-arrow-prev { left: auto; right: -14px; }\nhtml[dir=\"rtl\"] .rail-arrow-next { right: auto; left: -14px; }\nhtml[dir=\"rtl\"] .rail-arrow svg { transform: scaleX(-1); }\n\n/* Nav arrow — slightly smaller, sits inside the pill */\n.rail-nav .rail-arrow {\n  width: 28px; height: 28px;\n  box-shadow: none;\n  background: rgba(255,255,255,.08);\n  border-color: rgba(255,255,255,.14);\n  color: rgba(255,255,255,.9);\n  backdrop-filter: blur(6px);\n}\n[data-theme=\"light\"] .rail-nav .rail-arrow {\n  background: rgba(0,0,0,.04);\n  border-color: rgba(0,0,0,.1);\n  color: #0A0A0A;\n}\n.rail-nav .rail-arrow-prev { left: -6px; }\n.rail-nav .rail-arrow-next { right: -6px; }\nhtml[dir=\"rtl\"] .rail-nav .rail-arrow-prev { left: auto; right: -6px; }\nhtml[dir=\"rtl\"] .rail-nav .rail-arrow-next { right: auto; left: -6px; }\n\n/* Content carousels — convert existing grids into flex rails */\n.opt-carousel.rail-scroller {\n  display: flex !important;\n  flex-wrap: nowrap !important;\n  gap: 18px;\n  overflow-x: auto;\n  overflow-y: visible;\n  scroll-snap-type: x mandatory;\n  scroll-padding-inline: 4px;\n  scroll-behavior: smooth;\n  scrollbar-width: none;\n  -ms-overflow-style: none;\n  padding: 6px 4px 16px;\n  margin: 0 -4px;\n  /* override grid columns */\n  grid-template-columns: none !important;\n  grid-template-rows: none !important;\n}\n.opt-carousel.rail-scroller::-webkit-scrollbar { display: none; }\n.opt-carousel.rail-scroller > * {\n  flex: 0 0 auto;\n  scroll-snap-align: start;\n  margin: 0;\n}\n\n/* Per-section card widths in carousel mode */\n.opt-carousel-svc > *      { width: clamp(280px, 30vw, 360px); }\n.opt-carousel-cases > *    { width: clamp(300px, 36vw, 440px); }\n.opt-carousel-courses > *  { width: clamp(260px, 28vw, 320px); }\n.opt-carousel-blog > *     { width: clamp(280px, 32vw, 380px); }\n.opt-carousel-amb > *      { width: clamp(280px, 30vw, 340px); }\n\n@media (max-width: 720px) {\n  .opt-carousel.rail-scroller { gap: 14px; }\n  .opt-carousel > * { width: min(86vw, 360px) !important; }\n}\n\n/* Reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  .rail-scroller { scroll-behavior: auto; }\n  .opt-carousel.rail-scroller { scroll-snap-type: none; }\n}\n\n/* On tablet 880-1024 keep nav visible as a scroll rail instead\n   of hiding it. (Was display:none ≤1024.) */\n@media (min-width: 881px) and (max-width: 1024px) {\n  .primary-nav { display: flex !important; }\n  .menu-toggle { display: none !important; }\n}\n@media (max-width: 880px) {\n  /* Hide the rail-wrap holding primary-nav when hamburger takes over */\n  .rail-wrap.rail-nav { display: none; }\n}\n\n\n/* ============================================================\n   BILINGUAL COURSE CARD TITLES — Arabic + English always shown\n   ============================================================ */\n.course-title-bi {\n  font-family: var(--font-sans);\n  font-size: 17px;\n  line-height: 1.3;\n  letter-spacing: -.01em;\n  display: block;\n  margin: 0;\n}\n.course-title-bi .cti-ar {\n  font-family: var(--font-ar);\n  font-weight: 700;\n  color: var(--ink);\n  font-size: 17.5px;\n  background: linear-gradient(110deg, #FDD196 0%, #FF966D 22%, #E555C8 48%, #BE6FD2 65%, #54B3EC 82%, #00FEFF 100%);\n  -webkit-background-clip: text; background-clip: text;\n  color: transparent;\n  -webkit-text-fill-color: transparent;\n}\n.course-title-bi .cti-sep {\n  color: var(--ink-3);\n  margin: 0 .35em;\n  font-weight: 400;\n}\n.course-title-bi .cti-en {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  color: var(--ink);\n}\n/* Better wrap behaviour — keep parts together but allow break between halves */\n.course-title-bi .cti-ar, .course-title-bi .cti-en { white-space: normal; }\n\n/* In RTL pages, give the Arabic half visual prominence first */\nhtml[dir=\"rtl\"] .course-title-bi { text-align: right; }\n\n\n/* ============================================================\n   AMBIENT OPTIIIMUM GRADIENT MOTION — site-wide, very subtle\n   One global drifting blob layer behind everything (fixed),\n   plus a faint atmospheric wash inside solid-bg .section.band.\n   Performance-safe: pure CSS, no JS, single-layer transforms.\n   ============================================================ */\nbody { position: relative; isolation: isolate; }\nbody::before {\n  content: \"\";\n  position: fixed;\n  inset: -12%;\n  z-index: -1;\n  pointer-events: none;\n  background:\n    radial-gradient(36% 26% at 18% 22%, rgba(229,85,200,.16), transparent 70%),\n    radial-gradient(34% 24% at 78% 28%, rgba(84,179,236,.14), transparent 70%),\n    radial-gradient(40% 30% at 28% 78%, rgba(255,150,109,.12), transparent 70%),\n    radial-gradient(35% 26% at 80% 82%, rgba(0,254,255,.11), transparent 70%);\n  filter: blur(70px);\n  opacity: .55;\n  animation: optAmbientDrift 28s ease-in-out infinite alternate;\n  will-change: transform, opacity;\n}\n[data-theme=\"light\"] body::before {\n  opacity: .35;\n  background:\n    radial-gradient(36% 26% at 18% 22%, rgba(229,85,200,.13), transparent 70%),\n    radial-gradient(34% 24% at 78% 28%, rgba(84,179,236,.11), transparent 70%),\n    radial-gradient(40% 30% at 28% 78%, rgba(255,150,109,.10), transparent 70%),\n    radial-gradient(35% 26% at 80% 82%, rgba(0,254,255,.09), transparent 70%);\n}\n\n/* Ambient wash for .section.band — solid background hides body layer.\n   Use ::before so we don't conflict with section's own ::after. */\n.section.band { position: relative; isolation: isolate; }\n.section.band > .container { position: relative; z-index: 1; }\n.section.band::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n  pointer-events: none;\n  background:\n    radial-gradient(40% 30% at 22% 30%, rgba(229,85,200,.10), transparent 70%),\n    radial-gradient(36% 28% at 80% 70%, rgba(84,179,236,.08), transparent 70%);\n  filter: blur(50px);\n  opacity: .8;\n  animation: optAmbientDrift 32s ease-in-out infinite alternate-reverse;\n}\n[data-theme=\"light\"] .section.band::before { opacity: .55; }\n\n@keyframes optAmbientDrift {\n  0%   { transform: translate3d(0,0,0) scale(1); }\n  50%  { transform: translate3d(2%, -1.5%, 0) scale(1.05); }\n  100% { transform: translate3d(-1.5%, 2%, 0) scale(1.02); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  body::before, .section.band::before { animation: none !important; }\n}\n\n/* Make sure stacking is right — important interactive layers stay above */\n.topbar, .hero, .section, .final-cta-section, .foot, .intro { position: relative; }\n\n\n/* ============================================================\n   HOME BLOG PREVIEW — covers + premium card body\n   ============================================================ */\n.blog-grid .blog-card {\n  display: flex;\n  flex-direction: column;\n  background: var(--bg-elev);\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  overflow: hidden;\n  text-decoration: none;\n  color: inherit;\n  transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;\n}\n.blog-grid .blog-card:hover {\n  transform: translateY(-3px);\n  border-color: rgba(229,85,200,.4);\n  box-shadow: 0 18px 44px -22px rgba(229,85,200,.35);\n}\n.blog-grid .blog-card .thumb {\n  aspect-ratio: 16 / 10;\n  background-size: cover;\n  background-position: center;\n  background-color: var(--bg-band);\n  transition: transform .5s cubic-bezier(.2,.8,.2,1);\n}\n.blog-grid .blog-card:hover .thumb { transform: scale(1.04); }\n.blog-grid .blog-card .body {\n  padding: 22px 22px 24px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  flex: 1;\n}\n.blog-grid .blog-card .date {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\nhtml[lang=\"ar\"] .blog-grid .blog-card .date { font-family: var(--font-ar); letter-spacing: 0; text-transform: none; font-size: 13px; }\n.blog-grid .blog-card h3 {\n  font-family: var(--font-sans);\n  font-size: 19px;\n  line-height: 1.25;\n  letter-spacing: -.015em;\n  color: var(--ink);\n  margin: 0;\n  text-wrap: balance;\n}\n.blog-grid .blog-card p {\n  color: var(--ink-2);\n  font-size: 14.5px;\n  line-height: 1.6;\n  margin: 0;\n}\n.blog-grid .blog-card .read {\n  margin-top: auto;\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--ink);\n  display: inline-flex;\n  gap: 6px;\n  align-items: center;\n  width: max-content;\n  padding-bottom: 3px;\n  border-bottom: 1px solid var(--line);\n  transition: border-color .2s;\n}\n.blog-grid .blog-card:hover .read { border-color: var(--ink); }\nhtml[lang=\"ar\"] .blog-grid .blog-card .read { font-family: var(--font-ar); letter-spacing: 0; text-transform: none; font-size: 13px; }\n\n/* ============================================================\n   FACE-SAFE PEOPLE CARDS — site-wide, applies to every people card.\n   Rule: no label/badge/tag overlays a person's face, head, or upper\n   body. Category chips live ABOVE the photo. Portraits use a\n   smarter face-safe object-position. Images never crop heads.\n   ============================================================ */\n\n/* -- 1. AMBASSADOR CARDS (Ambassadors.html + Home preview) -- */\n/* DOM order is: .amb-portrait, .amb-body, .amb-cat\n   We use flex order to reposition the category chip BETWEEN the\n   portrait and the body — never on top of the face. */\n.amb-card {\n  display: flex !important;\n  flex-direction: column !important;\n}\n.amb-card .amb-portrait { order: 0; }\n.amb-card .amb-cat      { order: 1; }\n.amb-card .amb-body     { order: 2; }\n\n/* Category chip — moved out of the photo, into the card body strip.\n   Looks like a clean Optiiimum-style top-of-meta chip. */\n.amb-card .amb-cat {\n  position: static !important;          /* override prior absolute placement */\n  top: auto !important;\n  inset-inline-end: auto !important;\n  max-width: none !important;\n  white-space: normal !important;\n  display: inline-flex !important;\n  align-items: center;\n  gap: 8px;\n  margin: 16px 22px 0 !important;       /* sits above the name in the body */\n  align-self: flex-start;\n  padding: 6px 11px 6px 9px !important;\n  border-radius: 999px !important;\n  background: transparent !important;\n  backdrop-filter: none !important;\n  -webkit-backdrop-filter: none !important;\n  border: 1px solid var(--line) !important;\n  color: var(--ink-2) !important;\n  font-family: var(--font-mono);\n  font-size: 10px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  line-height: 1.2;\n  pointer-events: auto;\n}\n.amb-card .amb-cat::before {\n  content: \"\";\n  width: 6px; height: 6px; border-radius: 50%;\n  background: linear-gradient(135deg, var(--grad-3, #E555C8), var(--grad-5, #54B3EC));\n  flex: none;\n  box-shadow: 0 0 0 2px rgba(229,85,200,.12);\n}\n[data-theme=\"dark\"] .amb-card .amb-cat {\n  border-color: rgba(255,255,255,.12) !important;\n  color: rgba(255,255,255,.78) !important;\n}\nhtml[lang=\"ar\"] .amb-card .amb-cat {\n  font-family: var(--font-ar);\n  letter-spacing: 0;\n  text-transform: none;\n  font-size: 12px;\n}\n\n/* Body sits below the chip — re-tighten its top padding so the chip\n   reads as part of the meta block rather than floating in space. */\n.amb-card .amb-body { padding-top: 14px !important; }\n\n/* Portrait — face-safe positioning. Head/eyes always visible. */\n.amb-card .amb-portrait {\n  aspect-ratio: 4 / 5;\n}\n.amb-card .amb-portrait img {\n  object-fit: cover !important;\n  object-position: 50% 12% !important;   /* head/eyes priority */\n}\n\n/* Mobile: tighter chip margin, same logic */\n@media (max-width: 560px) {\n  .amb-card .amb-cat { margin: 14px 18px 0 !important; font-size: 9.5px; }\n  .amb-card .amb-body { padding: 12px 18px 18px !important; }\n}\n\n/* -- 2. TEAM ROLE CARDS (Team.html + any .amb in grids) -- */\n/* The team page uses .amb cards where role label lives inside .body\n   (already safe). We just tighten face-safe object-position so heads\n   aren't cropped on any of the 25 team portraits. */\n.amb .photo {\n  aspect-ratio: 4 / 5;\n  background-size: cover !important;\n  background-position: center 16% !important;  /* head priority */\n}\n.amb .photo img {\n  object-fit: cover;\n  object-position: center 16%;\n}\n/* If a card explicitly sets background-position inline (existing code\n   does this), we let it win — but we set 16% as the default fallback. */\n\n/* -- 3. REAL PEOPLE / CULTURE STRIP (Home Inside Optiiimum, Team) -- */\n/* Captions stay at bottom inside the dark gradient — already safe.\n   We reinforce face-safe object-position and ensure the bottom\n   gradient never climbs past the lower 40% of the photo. */\n.cs-card::after {\n  background: linear-gradient(180deg,\n    transparent 0%, transparent 55%,\n    rgba(0,0,0,.55) 80%, rgba(0,0,0,.82) 100%\n  ) !important;\n}\n.cs-card figcaption {\n  /* Force caption to bottom safe-zone only */\n  top: auto !important;\n  bottom: 12px !important;\n}\n\n/* -- 4. CASE-STUDY PERSON CARDS (.case-card .visual + .stat-pill) -- */\n/* When the visual is a person photo, the stat-pill currently sits in\n   the bottom-left corner with a dark gradient overlay — that's safe\n   for the face. We strengthen face-safety by making sure the visual\n   uses face-priority background-position and the bottom gradient\n   stays out of the upper half. */\n.case-card .visual {\n  background-position: center 22% !important;\n}\n.case-card .visual .stat-pill {\n  /* Already bottom-positioned — just reinforce */\n  top: auto;\n}\n\n/* -- 5. STORY PORTRAIT (About.html Jozeph card) -- */\n/* The dark bottom gradient + label is already in a safe zone at the\n   bottom. Tighten the gradient so it doesn't climb past 55%, and\n   bias the background to keep face visible. */\n.story-portrait {\n  background-position: center 18% !important;\n  background-size: cover !important;\n}\n.story-portrait::after {\n  background: linear-gradient(180deg,\n    transparent 0%, transparent 55%,\n    rgba(0,0,0,.45) 78%, rgba(0,0,0,.72) 100%\n  ) !important;\n}\n\n/* -- 6. INTRO PERSON CARDS (Home cinematic intro) -- */\n/* The intro person cards have a dark bottom gradient overlay with a\n   role tag inside — already in a safe zone. Reinforce object-position\n   to ensure the head/face is always visible for any randomized portrait. */\n.intro-card.card-person img {\n  object-fit: cover;\n  object-position: 50% 14%;\n}\n\n/* -- 7. UNIVERSAL FALLBACK: any <img> inside a known people container -- */\n/* Prevents head-cropping if a new card type is added later. */\n.amb-portrait img,\n.amb .photo img,\n.story-portrait > img {\n  object-fit: cover;\n  object-position: 50% 16%;\n}\n\n/* -- 8. ARABIC RTL: chip alignment -- */\nhtml[dir=\"rtl\"] .amb-card .amb-cat {\n  align-self: flex-end;\n  margin: 16px 22px 0 !important;\n}\n@media (max-width: 560px) {\n  html[dir=\"rtl\"] .amb-card .amb-cat { margin: 14px 18px 0 !important; }\n}\n\n/* ============================================================\n   ARABIC HERO TYPOGRAPHY — premium editorial composition\n   Two-font system: bold IBM Plex Sans Arabic for main words,\n   \"GESS Two Light\" (with Tajawal Light fallback) for the\n   gradient/accent rotator word. Spacing, line-height, and\n   letter-spacing are all RTL-aware to prevent overlap.\n   ============================================================ */\n\n/* GESS Two Light — try local install first (Saudi-market designers\n   often have this licensed), then fall back to a near-identical\n   web-safe Light Arabic display face. */\n@font-face {\n  font-family: \"GESS Two Light\";\n  src: local(\"GE SS Two Light\"),\n       local(\"GESS Two Light\"),\n       local(\"GE SS Two-Light\"),\n       local(\"GESSTwo-Light\"),\n       local(\"GE SS Two Lt\"),\n       local(\"GE SS Two\"),\n       local(\"Tajawal Light\"),\n       local(\"Tajawal-Light\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n\nhtml {\n  /* Bold/main Arabic stack — kept as-is for body text */\n  --font-ar: \"IBM Plex Sans Arabic\", \"Tajawal\", \"Segoe UI\", Tahoma, sans-serif;\n  /* Light/accent Arabic stack — tries GESS Two Light then degrades\n     gracefully through Tajawal Light → Cairo Light → IBM Plex Light. */\n  --font-ar-light: \"GESS Two Light\", \"Tajawal\", \"Cairo\", \"IBM Plex Sans Arabic\", \"Segoe UI\", Tahoma, sans-serif;\n}\n\n/* ---- 1. HERO HEADLINE STATIC TEXT (Arabic) ---- */\n/* Generous line-height, no negative tracking, proper RTL flow. */\nhtml[lang=\"ar\"] .hero h1 {\n  font-family: var(--font-ar);\n  font-weight: 700;\n  line-height: 1.55;           /* generous for Arabic ascenders/descenders */\n  letter-spacing: 0 !important; /* never compress Arabic glyphs */\n  text-align: start;\n  word-spacing: .02em;\n  max-width: 22ch;             /* gentle measure to keep editorial rhythm */\n  text-wrap: balance;\n  margin-block-start: 24px;\n}\nhtml[lang=\"ar\"] .hero h1 .i18n-ar {\n  display: block;\n  /* small breathing space above so the descenders of the preceding\n     chip never visually crash into ascenders of the headline */\n  padding-block-start: 4px;\n}\n\n/* ---- 2. ROTATOR (the accent word) — GESS Two Light + gradient ---- */\n/* This is the only Arabic word that uses the light accent face. */\nhtml[lang=\"ar\"] .hero-rotator,\nhtml[lang=\"ar\"] .hero-rotator .rw,\nhtml[lang=\"ar\"] .hero-rotator .rw-measure {\n  font-family: var(--font-ar-light) !important;\n  font-weight: 300 !important;           /* GESS Two Light feel */\n  letter-spacing: 0 !important;          /* never overlap Arabic glyphs */\n  font-style: normal;\n}\n/* Spacing around the accent word so it doesn't crash neighbours.\n   Logical margin works in both LTR/RTL. */\nhtml[lang=\"ar\"] .hero-rotator {\n  margin-inline: .25em;\n  padding-block: .12em;          /* vertical breathing room for marks */\n  line-height: inherit;          /* match h1 line-height */\n  /* The rotator container clips its rolling word — give it enough\n     vertical space so Arabic descenders (ج، ع، ق، ي) never get cut. */\n  min-height: 1.1em;\n}\n/* Slightly tighter, intentional translateY for the upward roll so\n   Arabic glyphs land on the right baseline — the prior 100% value\n   was tuned for Latin caps and clipped Arabic descenders. */\nhtml[lang=\"ar\"] .hero-rotator .rw          { transform: translateY(115%); }\nhtml[lang=\"ar\"] .hero-rotator .rw.in       { transform: translateY(0); }\nhtml[lang=\"ar\"] .hero-rotator .rw.out      { transform: translateY(-115%); }\n\n/* ---- 3. HERO LEDE (Arabic) ---- */\nhtml[lang=\"ar\"] .hero .lede {\n  font-family: var(--font-ar);\n  font-weight: 400;\n  font-size: clamp(15px, 1.35vw, 18px);\n  line-height: 1.85;\n  letter-spacing: 0;\n  max-width: 52ch;\n  text-wrap: pretty;\n  margin-top: 28px;\n}\n\n/* ---- 4. HERO CHIP (Arabic) — small chip above headline ---- */\nhtml[lang=\"ar\"] .hero .chip {\n  font-family: var(--font-ar);\n  font-weight: 500;\n  letter-spacing: 0;\n  font-size: 13px;\n}\n\n/* ---- 5. CTAs + stats spacing under Arabic hero ---- */\nhtml[lang=\"ar\"] .hero-ctas {\n  margin-top: 36px;\n  gap: 14px;\n}\nhtml[lang=\"ar\"] .hero-stats {\n  margin-top: 56px;\n}\n\n/* ---- 6. RESPONSIVE ---- */\n@media (max-width: 920px) {\n  html[lang=\"ar\"] .hero h1 {\n    line-height: 1.5;\n    max-width: 26ch;\n  }\n}\n@media (max-width: 720px) {\n  html[lang=\"ar\"] .hero h1 {\n    font-size: clamp(32px, 8.5vw, 52px);\n    line-height: 1.45;\n    max-width: 100%;\n  }\n  html[lang=\"ar\"] .hero .lede {\n    font-size: 15px;\n    line-height: 1.75;\n    margin-top: 22px;\n  }\n  html[lang=\"ar\"] .hero-ctas { margin-top: 28px; }\n  html[lang=\"ar\"] .hero-stats { margin-top: 44px; }\n}\n\n/* ---- 7. Make sure Arabic gradient text on the rotator renders\n        crisply — Arabic glyphs at large sizes can show seams in\n        the gradient if anti-aliasing is off. ---- */\nhtml[lang=\"ar\"] .hero-rotator .rw,\nhtml[lang=\"ar\"] .hero-rotator .rw-measure {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* ---- 8. ARABIC HERO LINE BREAK ----\n   The Arabic rotator sits on its OWN LINE below the main phrase\n   because Arabic adjectives follow the noun, not precede it. The\n   English version keeps its inline rotator; Arabic gets an\n   editorial two-line composition. */\n.hero-ar-rotator-line {\n  display: block;\n  margin-top: .35em;\n  /* Slightly larger and more emphatic to anchor the second line. */\n  line-height: 1.2;\n}\n.hero-ar-rotator-line .hero-rotator {\n  display: inline-block;\n  font-size: 1.05em;                 /* a touch larger than the main line */\n  vertical-align: baseline;\n  margin-inline: 0;\n}\n/* Hide the Arabic rotator-line wrapper in non-Arabic mode so the\n   English path is unaffected. */\nhtml:not([lang=\"ar\"]) .hero-ar-rotator-line { display: none; }\n\n/* ============================================================\n   REAL PEOPLE GRID — uniform editorial grid for the\n   \"Real people building real growth systems.\" section.\n   1 featured card (top-right of row, 2×2) + 4 same-size cards.\n   Replaces the old asymmetric .culture-strip / .cs-card bento.\n   ============================================================ */\n.real-people-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  grid-template-rows: 1fr 1fr;\n  grid-template-areas:\n    \"c1 c2 f f\"\n    \"c3 c4 f f\";\n  gap: 14px;\n  margin: 40px 0 28px;\n  /* Each row at minimum 220px so the featured card stays a generous\n     2× of a small card. Auto-rows clamp to viewport on wider screens. */\n  grid-auto-rows: minmax(220px, 1fr);\n}\n.rp-c1       { grid-area: c1; }\n.rp-c2       { grid-area: c2; }\n.rp-c3       { grid-area: c3; }\n.rp-c4       { grid-area: c4; }\n.rp-featured { grid-area: f;  }\n\n/* Every card — uniform style, rounded, premium border, hover lift */\n.rp-card {\n  position: relative;\n  margin: 0;\n  overflow: hidden;\n  border-radius: 18px;\n  background: var(--bg-band);\n  border: 1px solid var(--line);\n  isolation: isolate;\n  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s;\n}\n.rp-card:hover {\n  transform: translateY(-3px);\n  box-shadow: 0 18px 44px -22px rgba(229,85,200,.4), 0 6px 16px -8px rgba(0,0,0,.25);\n}\n[data-theme=\"light\"] .rp-card { border-color: rgba(0,0,0,.06); }\n\n/* Optional gradient border on hover — matches ambassadors/case cards */\n.rp-card::before {\n  content: \"\"; position: absolute; inset: -1px;\n  border-radius: inherit;\n  padding: 1px;\n  background: linear-gradient(135deg, #FDD196, #FF966D, #E555C8, #BE6FD2, #54B3EC, #00FEFF);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor; mask-composite: exclude;\n  opacity: 0;\n  transition: opacity .35s ease;\n  pointer-events: none;\n  z-index: 3;\n}\n.rp-card:hover::before { opacity: .85; }\n\n/* The photo — face-safe object-position, cover, no head cropping */\n.rp-card img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  object-position: 50% 28%;     /* face-safe: keep heads/eyes in frame */\n  transition: transform .6s cubic-bezier(.2,.8,.2,1), filter .3s ease;\n  display: block;\n}\n.rp-card:hover img { transform: scale(1.04); filter: saturate(1.06); }\n\n/* The featured card uses a slightly higher head-priority bias —\n   wider crops can swallow heads if 28% is used. */\n.rp-card.rp-featured img { object-position: 50% 30%; }\n\n/* Bottom-only dark gradient — caption sits in the safe zone, never\n   overlapping the face area. */\n.rp-card::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg,\n    transparent 0%, transparent 55%,\n    rgba(0,0,0,.55) 78%, rgba(0,0,0,.82) 100%);\n  pointer-events: none;\n  z-index: 1;\n}\n\n/* Caption — bottom-pinned pill, premium compact */\n.rp-card figcaption {\n  position: absolute;\n  left: 12px; right: 12px; bottom: 12px;\n  z-index: 2;\n  padding: 8px 12px;\n  border-radius: 10px;\n  background: rgba(11,11,11,.65);\n  backdrop-filter: blur(8px) saturate(140%);\n  -webkit-backdrop-filter: blur(8px) saturate(140%);\n  border: 1px solid rgba(255,255,255,.12);\n  display: flex; flex-direction: column; gap: 2px;\n}\n.rp-card .rp-name {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: 14px;\n  line-height: 1.2;\n  color: #FFFFFF;\n  letter-spacing: -.012em;\n}\n.rp-card .rp-role {\n  font-family: var(--font-mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,.78);\n}\nhtml[lang=\"ar\"] .rp-card .rp-name {\n  font-family: var(--font-ar);\n  font-weight: 600;\n  font-size: 14.5px;\n}\nhtml[lang=\"ar\"] .rp-card .rp-role {\n  font-family: var(--font-ar);\n  letter-spacing: 0;\n  text-transform: none;\n  font-size: 11.5px;\n}\n\n/* Featured card — bigger caption to match larger frame */\n.rp-card.rp-featured .rp-name { font-size: 18px; }\n.rp-card.rp-featured figcaption {\n  left: 16px; right: 16px; bottom: 16px;\n  padding: 10px 14px;\n}\n\n/* RESPONSIVE — keep face-safe + uniform sizing on every breakpoint.\n   On tablet, drop to 3 columns: featured spans 2×2, then 4 small cards\n   stack on the side. On phones, single column with featured at top. */\n/* Tablet: keep the same 4-col / 2-row layout — featured stays at the\n   top-end of the row, four small cards all identical size. We just\n   shrink the row height. NO aspect-ratio overrides — equality holds. */\n@media (max-width: 1080px) {\n  .real-people-grid {\n    grid-auto-rows: minmax(170px, 1fr);\n    gap: 12px;\n  }\n}\n/* Smaller tablet: stack featured full-width on top, four small cards\n   form a uniform 2×2 grid beneath — every small card identical. */\n@media (max-width: 820px) {\n  .real-people-grid {\n    grid-template-columns: 1fr 1fr;\n    grid-template-areas:\n      \"f  f\"\n      \"c1 c2\"\n      \"c3 c4\";\n    grid-auto-rows: minmax(170px, 1fr);\n    gap: 10px;\n  }\n  .rp-card.rp-featured { aspect-ratio: 16 / 10; }\n  .rp-card .rp-name { font-size: 13px; }\n  .rp-card.rp-featured .rp-name { font-size: 16px; }\n}\n@media (max-width: 480px) {\n  .real-people-grid {\n    grid-template-columns: 1fr;\n    grid-template-areas:\n      \"f\"\n      \"c1\"\n      \"c2\"\n      \"c3\"\n      \"c4\";\n    grid-auto-rows: minmax(220px, auto);\n  }\n  .rp-card.rp-featured { aspect-ratio: 16 / 10; }\n}\n\n/* Hide the legacy .culture-strip if present elsewhere in the section —\n   we use the new .real-people-grid now. */\n#team .culture-strip { display: none !important; }\n\n\n/* ============================================================\n   PRIMARY NAV — paged slider (shared across all pages).\n   Was inline in Home.html; moved here so every page that links\n   home.css gets the same tab look + gradient active state.\n   ============================================================ */\n.primary-nav-wrap {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex: 1 1 auto;\n  min-width: 0;\n  max-width: 820px;\n  margin: 0 auto;\n  padding: 0 12px;\n}\n.nav-arrow {\n  flex: none;\n  width: 32px; height: 32px;\n  display: inline-flex; align-items: center; justify-content: center;\n  background: transparent;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  color: var(--ink-2);\n  cursor: pointer; padding: 0;\n  position: relative;\n  transition: color .18s ease, border-color .18s ease, background .18s ease, transform .15s ease, opacity .18s ease;\n}\n.nav-arrow svg { width: 14px; height: 14px; }\n.nav-arrow:hover {\n  color: var(--ink);\n  border-color: var(--ink);\n  background: rgba(127,127,127,.06);\n}\n.nav-arrow:active { transform: scale(.94); }\n.nav-arrow:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }\n.nav-arrow[disabled], .nav-arrow.is-disabled {\n  opacity: .28; cursor: default; pointer-events: none;\n}\nhtml[dir=\"rtl\"] .nav-arrow svg { transform: scaleX(-1); }\n\n.nav-slider {\n  flex: 1 1 auto;\n  min-width: 0;\n  overflow: hidden;\n  position: relative;\n  padding: 0 8px;\n  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);\n          mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);\n}\n.nav-track {\n  display: flex;\n  align-items: stretch;\n  direction: ltr;\n  transition: transform .42s cubic-bezier(.2,.8,.2,1);\n  will-change: transform;\n}\n.nav-track > a {\n  flex: 0 0 25%;\n  max-width: 25%;\n  min-width: 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  font-size: 13.5px;\n  font-weight: 500;\n  color: var(--ink-2);\n  padding: 9px 14px;\n  white-space: nowrap;\n  text-overflow: ellipsis;\n  overflow: hidden;\n  border-radius: 999px;\n  transition: color .15s ease, background .15s ease;\n}\n[data-theme=\"light\"] .nav-track > a { color: rgba(0,0,0,.65); }\n.nav-track > a:hover {\n  color: var(--ink);\n  background: rgba(127,127,127,.06);\n}\n.nav-track > a[aria-current=\"page\"] {\n  background: linear-gradient(120deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4), var(--grad-5), var(--grad-6));\n  color: #0A0A0A;\n  font-weight: 600;\n}\n[data-theme=\"light\"] .nav-track > a[aria-current=\"page\"] { color: #0A0A0A; }\nhtml[lang=\"ar\"] .nav-track > a {\n  font-family: var(--font-ar);\n  font-size: 14px;\n  font-weight: 500;\n}\nhtml[lang=\"ar\"] .nav-track > a[aria-current=\"page\"] { font-weight: 700; }\n\n@media (max-width: 1180px) {\n  .primary-nav-wrap { max-width: 660px; gap: 8px; padding: 0 10px; }\n  .nav-track > a { font-size: 13px; padding: 8px 10px; }\n}\n@media (max-width: 1024px) {\n  .primary-nav-wrap { max-width: 520px; }\n  .nav-track > a { font-size: 12.5px; padding: 7px 8px; letter-spacing: -.005em; }\n}\n@media (max-width: 880px) {\n  .primary-nav-wrap { display: none; }\n}\n@media (min-width: 881px) and (max-width: 980px) {\n  .nav-track > a { flex: 0 0 33.333%; max-width: 33.333%; }\n  .primary-nav-wrap { --nav-per-page: 3; }\n}\n.primary-nav-wrap { --nav-per-page: 4; }\n<\u002Fstyle>\n\n\n\n<style>\n  /* ===== Hero ===== */\n  .intern-hero {\n    position: relative; overflow: hidden;\n    padding: clamp(96px, 14vw, 160px) 0 clamp(36px, 5vw, 64px);\n  }\n  .intern-hero .eyebrow { display: inline-block; }\n  .intern-hero h1 {\n    max-width: 22ch;\n    margin-top: 18px;\n    font-size: clamp(40px, 7vw, 88px);\n    line-height: 1.03;\n    text-wrap: balance;\n  }\n  .intern-hero h1 .alt {\n    font-style: italic;\n    background: linear-gradient(120deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4), var(--grad-5), var(--grad-6));\n    -webkit-background-clip: text; background-clip: text; color: transparent;\n  }\n  html[lang=\"ar\"] .intern-hero h1 .alt { font-style: normal; font-weight: 700; }\n  .intern-hero .lede {\n    max-width: 60ch; margin-top: 24px;\n    font-size: clamp(16px, 1.3vw, 19px); line-height: 1.6;\n    color: var(--ink-2);\n  }\n  .intern-hero-orb {\n    position: absolute; pointer-events: none; z-index: -1;\n    width: 60vw; height: 60vw; max-width: 720px; max-height: 720px;\n    inset-inline-end: -18vw; top: -16vw;\n    background: conic-gradient(from 220deg at 50% 50%,\n      var(--grad-1), var(--grad-6), var(--grad-5),\n      var(--grad-4), var(--grad-3), var(--grad-2), var(--grad-1));\n    filter: blur(120px); opacity: .3; border-radius: 50%;\n  }\n\n  /* ===== Facts strip ===== */\n  .intern-facts {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 18px;\n    padding: 32px 0;\n    border-top: 1px solid var(--line);\n    border-bottom: 1px solid var(--line);\n    margin-top: 18px;\n  }\n  @media (max-width: 720px) { .intern-facts { grid-template-columns: repeat(2, 1fr); } }\n  .intern-fact { padding: 4px 12px; }\n  .intern-fact .n {\n    display: block;\n    font-family: var(--font-serif); font-style: italic;\n    font-size: clamp(34px, 4vw, 48px);\n    line-height: 1; letter-spacing: -.02em;\n    background: linear-gradient(120deg, var(--grad-1), var(--grad-3), var(--grad-5));\n    -webkit-background-clip: text; background-clip: text; color: transparent;\n  }\n  html[lang=\"ar\"] .intern-fact .n { font-family: var(--font-ar); font-style: normal; font-weight: 700; }\n  .intern-fact .lbl {\n    font-family: var(--font-mono); font-size: 10.5px;\n    letter-spacing: .15em; text-transform: uppercase;\n    color: var(--ink-3); margin-top: 8px; display: block;\n  }\n  html[lang=\"ar\"] .intern-fact .lbl { font-family: var(--font-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }\n\n  /* ===== Section blocks ===== */\n  .intern-section { padding: clamp(64px, 9vw, 110px) 0; }\n  .intern-section h2 {\n    font-size: clamp(32px, 4.4vw, 56px);\n    line-height: 1.05; margin: 8px 0 0; max-width: 22ch;\n    letter-spacing: -.015em;\n  }\n  .intern-section .lede {\n    max-width: 60ch; margin-top: 18px;\n    color: var(--ink-2); font-size: 16px; line-height: 1.6;\n  }\n\n  /* ===== Tracks grid ===== */\n  .tracks {\n    display: grid; gap: 16px; margin-top: 40px;\n    grid-template-columns: repeat(4, 1fr);\n  }\n  @media (max-width: 1024px) { .tracks { grid-template-columns: repeat(2, 1fr); } }\n  @media (max-width: 560px)  { .tracks { grid-template-columns: 1fr; } }\n  .track {\n    padding: 24px 22px 22px;\n    border-radius: var(--r-lg);\n    background: var(--bg-band);\n    border: 1px solid var(--line);\n    position: relative;\n    transition: transform .25s, border-color .25s;\n  }\n  .track:hover { transform: translateY(-3px); border-color: var(--ink-3); }\n  .track .num {\n    font-family: var(--font-mono); font-size: 11px;\n    color: var(--ink-3); letter-spacing: .18em;\n    margin-bottom: 14px; display: block;\n  }\n  .track b {\n    font-family: var(--font-serif); font-size: 22px;\n    line-height: 1.15; letter-spacing: -.005em; display: block;\n  }\n  html[lang=\"ar\"] .track b { font-family: var(--font-ar); font-weight: 700; font-style: normal; }\n  .track p { color: var(--ink-2); font-size: 14px; line-height: 1.55; margin: 8px 0 0; }\n\n  /* ===== Timeline ===== */\n  .timeline {\n    display: grid; gap: 14px; margin-top: 36px;\n    grid-template-columns: repeat(4, 1fr);\n  }\n  @media (max-width: 720px) { .timeline { grid-template-columns: 1fr; } }\n  .tl-step {\n    padding: 22px;\n    border-radius: var(--r-lg);\n    border: 1px solid var(--line);\n    position: relative;\n  }\n  .tl-step .week {\n    font-family: var(--font-mono); font-size: 10.5px;\n    letter-spacing: .18em; text-transform: uppercase;\n    color: var(--ink-3); display: block; margin-bottom: 10px;\n  }\n  html[lang=\"ar\"] .tl-step .week { font-family: var(--font-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }\n  .tl-step b {\n    font-family: var(--font-serif); font-size: 20px; line-height: 1.2;\n    display: block;\n  }\n  html[lang=\"ar\"] .tl-step b { font-family: var(--font-ar); font-weight: 700; }\n  .tl-step p { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; margin: 8px 0 0; }\n\n  /* ===== Two-col who + outcomes ===== */\n  .two-col {\n    display: grid; grid-template-columns: 1fr 1fr;\n    gap: clamp(28px, 4vw, 56px); margin-top: 36px;\n  }\n  @media (max-width: 920px) { .two-col { grid-template-columns: 1fr; } }\n  .two-col .col h3 {\n    font-family: var(--font-serif); font-size: 28px;\n    line-height: 1.15; letter-spacing: -.005em; margin: 0 0 18px;\n  }\n  html[lang=\"ar\"] .two-col .col h3 { font-family: var(--font-ar); font-weight: 700; }\n  .two-col ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }\n  .two-col li {\n    padding: 16px 18px; border-radius: 14px;\n    border: 1px solid var(--line); background: var(--bg-band);\n    color: var(--ink-2); font-size: 14.5px; line-height: 1.55;\n    position: relative; padding-inline-start: 44px;\n  }\n  .two-col li::before {\n    content: \"→\"; position: absolute;\n    inset-inline-start: 18px; top: 14px;\n    color: var(--grad-4); font-weight: 700;\n  }\n  html[dir=\"rtl\"] .two-col li::before { content: \"←\"; }\n\n  /* ===== FAQ ===== */\n  .intern-faq { display: grid; gap: 8px; margin-top: 36px; max-width: 820px; }\n  .intern-faq details {\n    border: 1px solid var(--line); border-radius: var(--r-md);\n    padding: 18px 22px; background: var(--bg-band);\n    transition: background .25s;\n  }\n  .intern-faq details[open] { background: var(--bg-elev); }\n  .intern-faq summary {\n    list-style: none; cursor: pointer;\n    display: flex; align-items: center; justify-content: space-between;\n    font-family: var(--font-serif); font-size: 19px;\n    line-height: 1.25; letter-spacing: -.005em;\n  }\n  html[lang=\"ar\"] .intern-faq summary { font-family: var(--font-ar); font-weight: 700; }\n  .intern-faq summary::-webkit-details-marker { display: none; }\n  .intern-faq summary::after {\n    content: \"+\"; font-family: var(--font-mono);\n    font-size: 22px; color: var(--ink-3);\n    transition: transform .25s;\n  }\n  .intern-faq details[open] summary::after { content: \"−\"; }\n  .intern-faq details p {\n    margin: 12px 0 0; color: var(--ink-2);\n    font-size: 14.5px; line-height: 1.6;\n  }\n\n  /* ===== Apply CTA ===== */\n  .intern-cta { padding: clamp(64px, 9vw, 110px) 0 clamp(96px, 12vw, 140px); }\n  .intern-cta .opt-box {\n    text-align: center;\n    padding: clamp(48px, 7vw, 96px) clamp(24px, 4vw, 56px);\n  }\n  .intern-cta h2 {\n    max-width: 24ch; margin: 0 auto;\n    font-size: clamp(34px, 5vw, 60px); line-height: 1.05;\n    letter-spacing: -.015em;\n  }\n  .intern-cta .lede { max-width: 56ch; margin: 18px auto 28px; color: var(--ink-2); }\n  .intern-cta-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============ HEADER ============ -->\n<header class=\"topbar\">\n  <div class=\"container topbar-inner\">\n    <a href=\"Home.html\" class=\"brand-link\" aria-label=\"Optiiimum home\">\n      <span class=\"brand-name\">optiiimum<span class=\"dot\">.<\u002Fspan><\u002Fspan>\n    <\u002Fa>\n\n    <nav class=\"primary-nav-wrap\" aria-label=\"Primary\">\n      <div class=\"nav-slider\"><div class=\"nav-track\">\n        <a href=\"Home.html\"><span class=\"i18n-en\">Home<\u002Fspan><span class=\"i18n-ar\">الرئيسية<\u002Fspan><\u002Fa>\n        <a href=\"About.html\"><span class=\"i18n-en\">About<\u002Fspan><span class=\"i18n-ar\">من نحن<\u002Fspan><\u002Fa>\n        <a href=\"Services.html\"><span class=\"i18n-en\">Services<\u002Fspan><span class=\"i18n-ar\">الخدمات<\u002Fspan><\u002Fa>\n        <a href=\"CaseStudies.html\"><span class=\"i18n-en\">Case Studies<\u002Fspan><span class=\"i18n-ar\">دراسات الحالة<\u002Fspan><\u002Fa>\n        <a href=\"branding.html\"><span class=\"i18n-en\">Branding<\u002Fspan><span class=\"i18n-ar\">مشاريع البراندينج<\u002Fspan><\u002Fa>\n        <a href=\"JokerProgram.html\"><span class=\"i18n-en\">Joker Program<\u002Fspan><span class=\"i18n-ar\">برنامج الجوكر<\u002Fspan><\u002Fa>\n        <a href=\"Courses.html\"><span class=\"i18n-en\">Courses<\u002Fspan><span class=\"i18n-ar\">الأكاديمية<\u002Fspan><\u002Fa>\n        <a href=\"Clients.html\"><span class=\"i18n-en\">Clients<\u002Fspan><span class=\"i18n-ar\">العملاء<\u002Fspan><\u002Fa>\n        <a href=\"Blog.html\"><span class=\"i18n-en\">Blogs<\u002Fspan><span class=\"i18n-ar\">المقالات<\u002Fspan><\u002Fa>\n        <a href=\"Ambassadors.html\"><span class=\"i18n-en\">Ambassadors<\u002Fspan><span class=\"i18n-ar\">السفراء<\u002Fspan><\u002Fa>\n        <a href=\"Careers.html\" aria-current=\"page\"><span class=\"i18n-en\">Careers<\u002Fspan><span class=\"i18n-ar\">الوظائف<\u002Fspan><\u002Fa>\n        <a href=\"contacts.html\"><span class=\"i18n-en\">Contacts &amp; FAQs<\u002Fspan><span class=\"i18n-ar\">تواصل معنا والأسئلة<\u002Fspan><\u002Fa>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fnav>\n\n    <div class=\"topbar-actions\">\n      <button class=\"icon-btn lang-btn\" id=\"langToggle\" aria-label=\"Switch language\">\n        <span class=\"i18n-en\">عربي<\u002Fspan><span class=\"i18n-ar\">EN<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"icon-btn\" id=\"themeToggle\" aria-label=\"Switch theme\"><span id=\"themeIcon\">◐<\u002Fspan><\u002Fbutton>\n      <a href=\"#apply\" class=\"nav-cta\">\n        <span class=\"i18n-en\">Apply now<\u002Fspan><span class=\"i18n-ar\">قدّم الآن<\u002Fspan>\n        <span class=\"arrow\">→<\u002Fspan>\n      <\u002Fa>\n      <button class=\"icon-btn menu-toggle\" id=\"menuOpen\" aria-label=\"Open menu\">≡<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"mobile-menu\" id=\"mobileMenu\">\n  <button class=\"icon-btn mobile-close\" id=\"menuClose\" aria-label=\"Close menu\">✕<\u002Fbutton>\n  <a href=\"Home.html\"><span class=\"i18n-en\">Home<\u002Fspan><span class=\"i18n-ar\">الرئيسية<\u002Fspan><\u002Fa>\n  <a href=\"About.html\"><span class=\"i18n-en\">About<\u002Fspan><span class=\"i18n-ar\">من نحن<\u002Fspan><\u002Fa>\n  <a href=\"Services.html\"><span class=\"i18n-en\">Services<\u002Fspan><span class=\"i18n-ar\">الخدمات<\u002Fspan><\u002Fa>\n  <a href=\"CaseStudies.html\"><span class=\"i18n-en\">Case Studies<\u002Fspan><span class=\"i18n-ar\">دراسات الحالة<\u002Fspan><\u002Fa>\n  <a href=\"branding.html\"><span class=\"i18n-en\">Branding<\u002Fspan><span class=\"i18n-ar\">مشاريع البراندينج<\u002Fspan><\u002Fa>\n  <a href=\"JokerProgram.html\"><span class=\"i18n-en\">Joker Program<\u002Fspan><span class=\"i18n-ar\">برنامج الجوكر<\u002Fspan><\u002Fa>\n  <a href=\"Courses.html\"><span class=\"i18n-en\">Courses<\u002Fspan><span class=\"i18n-ar\">الأكاديمية<\u002Fspan><\u002Fa>\n  <a href=\"Clients.html\"><span class=\"i18n-en\">Clients<\u002Fspan><span class=\"i18n-ar\">العملاء<\u002Fspan><\u002Fa>\n  <a href=\"Blog.html\"><span class=\"i18n-en\">Blogs<\u002Fspan><span class=\"i18n-ar\">المقالات<\u002Fspan><\u002Fa>\n  <a href=\"Ambassadors.html\"><span class=\"i18n-en\">Ambassadors<\u002Fspan><span class=\"i18n-ar\">السفراء<\u002Fspan><\u002Fa>\n  <a href=\"Careers.html\" aria-current=\"page\"><span class=\"i18n-en\">Careers<\u002Fspan><span class=\"i18n-ar\">الوظائف<\u002Fspan><\u002Fa>\n  <a href=\"contacts.html\"><span class=\"i18n-en\">Contacts &amp; FAQs<\u002Fspan><span class=\"i18n-ar\">تواصل معنا والأسئلة<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<!-- ============ HERO ============ -->\n<section class=\"intern-hero\">\n  <div class=\"intern-hero-orb\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"container\">\n    <span class=\"eyebrow\">\n      <span class=\"i18n-en\">Growth Internship Program · Optiiimum<\u002Fspan>\n      <span class=\"i18n-ar\">برنامج تدريب النمو · Optiiimum<\u002Fspan>\n    <\u002Fspan>\n    <h1>\n      <span class=\"i18n-en\">Start your first career step <span class=\"alt\">in a real growth team.<\u002Fspan><\u002Fspan>\n      <span class=\"i18n-ar\">ابدأ خطوتك الأولى في <span class=\"alt\">فريق نمو حقيقي.<\u002Fspan><\u002Fspan>\n    <\u002Fh1>\n    <p class=\"lede\">\n      <span class=\"i18n-en\">A 3-month paid internship at Optiiimum's Cairo office. You'll rotate across content, design, strategy, and media buying — shipping real work for real brands, mentored by senior leads. Top performers join the team full-time.<\u002Fspan>\n      <span class=\"i18n-ar\">برنامج تدريب مدفوع لمدة 3 شهور في مقرنا بالقاهرة. هتلف على أقسام المحتوى، الديزاين، الاستراتيجية، والميديا باينج — وهتطلق شغل فعلي لبراندات حقيقية، تحت إشراف ليدز سينيور. اللي يتميّز بينضم للفريق فل تايم.<\u002Fspan>\n    <\u002Fp>\n\n    <div class=\"intern-facts\">\n      <div class=\"intern-fact\">\n        <span class=\"n\">3<\u002Fspan>\n        <span class=\"lbl\"><span class=\"i18n-en\">Months · paid<\u002Fspan><span class=\"i18n-ar\">شهور · مدفوع<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"intern-fact\">\n        <span class=\"n\">4<\u002Fspan>\n        <span class=\"lbl\"><span class=\"i18n-en\">Department rotations<\u002Fspan><span class=\"i18n-ar\">أقسام للتدوير<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"intern-fact\">\n        <span class=\"n\">6+<\u002Fspan>\n        <span class=\"lbl\"><span class=\"i18n-en\">Senior mentors<\u002Fspan><span class=\"i18n-ar\">مرشدين سينيور<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"intern-fact\">\n        <span class=\"n\">70%<\u002Fspan>\n        <span class=\"lbl\"><span class=\"i18n-en\">Convert to full-time<\u002Fspan><span class=\"i18n-ar\">بيلتحقوا فل تايم<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TRACKS ============ -->\n<section class=\"intern-section\">\n  <div class=\"container\">\n    <span class=\"eyebrow\">\n      <span class=\"i18n-en\">What you'll rotate through<\u002Fspan>\n      <span class=\"i18n-ar\">الأقسام اللي هتشتغل فيها<\u002Fspan>\n    <\u002Fspan>\n    <h2>\n      <span class=\"i18n-en\">Four real tracks. <span class=\"opt-grad-text\">One growth team.<\u002Fspan><\u002Fspan>\n      <span class=\"i18n-ar\">٤ مسارات شغل حقيقية. <span class=\"opt-grad-text\">فريق نمو واحد.<\u002Fspan><\u002Fspan>\n    <\u002Fh2>\n    <p class=\"lede\">\n      <span class=\"i18n-en\">You won't make coffee. From day one you'll be inside live accounts — drafting briefs, editing posts, building decks, reviewing ad performance, and learning how digital growth actually compounds.<\u002Fspan>\n      <span class=\"i18n-ar\">مفيش قهوة. من اليوم الأول هتكون داخل حسابات شغّالة — بتساعد في برييفات، بتحرّر بوستات، بتبني عروض، بتراجع أداء إعلانات، وبتفهم النمو الرقمي إزاي بيتراكم فعلًا.<\u002Fspan>\n    <\u002Fp>\n\n    <div class=\"tracks\">\n      <article class=\"track\">\n        <span class=\"num\">01<\u002Fspan>\n        <b><span class=\"i18n-en\">Content &amp; Strategy<\u002Fspan><span class=\"i18n-ar\">المحتوى والاستراتيجية<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Audience research, scripting, content calendars, bilingual copy in AR/EN. You'll ship at least 10 published posts.<\u002Fspan>\n          <span class=\"i18n-ar\">بحث جمهور، كتابة سكربتات، تقاويم محتوى، نسخ ثنائية اللغة. هتطلق على الأقل 10 منشورات منشورة.<\u002Fspan>\n        <\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"track\">\n        <span class=\"num\">02<\u002Fspan>\n        <b><span class=\"i18n-en\">Design &amp; Brand<\u002Fspan><span class=\"i18n-ar\">الديزاين والبراند<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Brand templates, social grids, motion graphics fundamentals, and applying brand guidelines under an art director.<\u002Fspan>\n          <span class=\"i18n-ar\">قوالب براند، جريد سوشيال، أساسيات الموشن جرافيكس، وتطبيق دليل البراند تحت إشراف آرت دايركتور.<\u002Fspan>\n        <\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"track\">\n        <span class=\"num\">03<\u002Fspan>\n        <b><span class=\"i18n-en\">Production &amp; Video<\u002Fspan><span class=\"i18n-ar\">الإنتاج والفيديو<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Pre-production planning, on-set assistance, cuts and short-form editing. End the rotation with a published reel.<\u002Fspan>\n          <span class=\"i18n-ar\">تخطيط ما قبل الإنتاج، مساعدة على السيت، مونتاج وقصص قصيرة. تخرج بريل منشورة باسمك.<\u002Fspan>\n        <\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"track\">\n        <span class=\"num\">04<\u002Fspan>\n        <b><span class=\"i18n-en\">Media Buying &amp; Analytics<\u002Fspan><span class=\"i18n-ar\">شراء الإعلانات والتحليلات<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Meta &amp; TikTok ads basics, audience structures, reading reports, and writing weekly performance summaries.<\u002Fspan>\n          <span class=\"i18n-ar\">أساسيات إعلانات ميتا وتيك توك، تركيب الجمهور، قراءة تقارير، وكتابة ملخصات أداء أسبوعية.<\u002Fspan>\n        <\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TIMELINE ============ -->\n<section class=\"intern-section\" style=\"background: var(--bg-band); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n  <div class=\"container\">\n    <span class=\"eyebrow\">\n      <span class=\"i18n-en\">The 12 weeks<\u002Fspan>\n      <span class=\"i18n-ar\">الـ ١٢ أسبوع<\u002Fspan>\n    <\u002Fspan>\n    <h2>\n      <span class=\"i18n-en\">Structured to make you <span class=\"opt-grad-text\">job-ready.<\u002Fspan><\u002Fspan>\n      <span class=\"i18n-ar\">مبني علشان تخرج <span class=\"opt-grad-text\">جاهز للسوق.<\u002Fspan><\u002Fspan>\n    <\u002Fh2>\n\n    <div class=\"timeline\">\n      <div class=\"tl-step\">\n        <span class=\"week\"><span class=\"i18n-en\">Weeks 1–2<\u002Fspan><span class=\"i18n-ar\">الأسبوع ١–٢<\u002Fspan><\u002Fspan>\n        <b><span class=\"i18n-en\">Onboard<\u002Fspan><span class=\"i18n-ar\">انضمام<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Meet the team, learn our process, read past case studies, shadow live meetings.<\u002Fspan>\n          <span class=\"i18n-ar\">اتعرف على الفريق، اتعلم العملية، اقرا دراسات حالة سابقة، احضر اجتماعات حية.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-step\">\n        <span class=\"week\"><span class=\"i18n-en\">Weeks 3–6<\u002Fspan><span class=\"i18n-ar\">الأسبوع ٣–٦<\u002Fspan><\u002Fspan>\n        <b><span class=\"i18n-en\">First rotation<\u002Fspan><span class=\"i18n-ar\">أول قسم<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Embed in one department. Own a small piece of a real account end-to-end with a senior mentor.<\u002Fspan>\n          <span class=\"i18n-ar\">انضم لقسم واحد. خد جزء صغير من حساب حقيقي من البداية للنهاية مع مرشد سينيور.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-step\">\n        <span class=\"week\"><span class=\"i18n-en\">Weeks 7–10<\u002Fspan><span class=\"i18n-ar\">الأسبوع ٧–١٠<\u002Fspan><\u002Fspan>\n        <b><span class=\"i18n-en\">Second rotation<\u002Fspan><span class=\"i18n-ar\">القسم التاني<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Switch into the department that fits your strength. Ship measurable work with named credit.<\u002Fspan>\n          <span class=\"i18n-ar\">انتقل للقسم اللي بيناسب قوتك. طلّق شغل بقياسات حقيقية وباسمك.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-step\">\n        <span class=\"week\"><span class=\"i18n-en\">Weeks 11–12<\u002Fspan><span class=\"i18n-ar\">الأسبوع ١١–١٢<\u002Fspan><\u002Fspan>\n        <b><span class=\"i18n-en\">Showcase<\u002Fspan><span class=\"i18n-ar\">عرض ختامي<\u002Fspan><\u002Fb>\n        <p>\n          <span class=\"i18n-en\">Present your 12-week portfolio to the leadership team. Top performers are offered a full-time role.<\u002Fspan>\n          <span class=\"i18n-ar\">اعرض بورتفوليو الـ١٢ أسبوع بتاعك على القيادة. اللي يتميّز بنعرض عليه فل تايم.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ WHO + OUTCOMES ============ -->\n<section class=\"intern-section\">\n  <div class=\"container\">\n    <span class=\"eyebrow\">\n      <span class=\"i18n-en\">Who this is for<\u002Fspan>\n      <span class=\"i18n-ar\">البرنامج ده لمين<\u002Fspan>\n    <\u002Fspan>\n    <h2>\n      <span class=\"i18n-en\">Built for graduates who <span class=\"opt-grad-text\">want to start strong.<\u002Fspan><\u002Fspan>\n      <span class=\"i18n-ar\">للخريجين اللي عايزين <span class=\"opt-grad-text\">يبدأوا قوي.<\u002Fspan><\u002Fspan>\n    <\u002Fh2>\n\n    <div class=\"two-col\">\n      <div class=\"col\">\n        <h3><span class=\"i18n-en\">You'll thrive here if you…<\u002Fspan><span class=\"i18n-ar\">هتبدع هنا لو…<\u002Fspan><\u002Fh3>\n        <ul>\n          <li><span class=\"i18n-en\">Graduated in the last 18 months in marketing, media, design, business, or anything you can defend.<\u002Fspan><span class=\"i18n-ar\">اتخرّجت في آخر 18 شهر من تخصص تسويق، إعلام، ديزاين، أعمال، أو أي تخصص تقدر تدافع عنه.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Write strong Arabic and English — both, not just one.<\u002Fspan><span class=\"i18n-ar\">بتكتب عربي وإنجليزي قوي — الاتنين، مش واحد بس.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Live in (or can relocate to) Greater Cairo. The internship is on-site.<\u002Fspan><span class=\"i18n-ar\">ساكن (أو تقدر تنتقل) للقاهرة الكبرى. التدريب حضوري.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Already make things — even if just for yourself. Portfolio &gt; transcript.<\u002Fspan><span class=\"i18n-ar\">بتعمل حاجات بنفسك — حتى لو لنفسك بس. البورتفوليو أهم من الشهادة.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Take feedback well and ship faster than you talk.<\u002Fspan><span class=\"i18n-ar\">بتتقبّل الملاحظات وبتنفّذ أسرع ما تتكلم.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"col\">\n        <h3><span class=\"i18n-en\">What you'll leave with<\u002Fspan><span class=\"i18n-ar\">هتطلع بإيه<\u002Fspan><\u002Fh3>\n        <ul>\n          <li><span class=\"i18n-en\">A 12-week portfolio of real, published work — with brand names you can show.<\u002Fspan><span class=\"i18n-ar\">بورتفوليو ١٢ أسبوع شغل حقيقي منشور — بأسماء براندات تقدر تعرضها.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Hands-on experience across content, design, video, and paid media.<\u002Fspan><span class=\"i18n-ar\">خبرة عملية في المحتوى، الديزاين، الفيديو، والميديا المدفوعة.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">Senior mentorship and a named reference for your CV and LinkedIn.<\u002Fspan><span class=\"i18n-ar\">إرشاد سينيور ومرجع باسم محدد للسيرة الذاتية واللينكدإن.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">A monthly stipend and a clear path to a full-time offer.<\u002Fspan><span class=\"i18n-ar\">مكافأة شهرية ومسار واضح لعرض توظيف فل تايم.<\u002Fspan><\u002Fli>\n          <li><span class=\"i18n-en\">An alumni network of past interns now working across the region.<\u002Fspan><span class=\"i18n-ar\">شبكة خريجين من المتدربين السابقين الشغّالين في المنطقة.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section class=\"intern-section\" style=\"background: var(--bg-band); border-top: 1px solid var(--line);\">\n  <div class=\"container\">\n    <span class=\"eyebrow\">\n      <span class=\"i18n-en\">Common questions<\u002Fspan>\n      <span class=\"i18n-ar\">أسئلة شائعة<\u002Fspan>\n    <\u002Fspan>\n    <h2>\n      <span class=\"i18n-en\">Before you apply.<\u002Fspan>\n      <span class=\"i18n-ar\">قبل ما تقدّم.<\u002Fspan>\n    <\u002Fh2>\n\n    <div class=\"intern-faq\">\n      <details>\n        <summary><span class=\"i18n-en\">Is the internship paid?<\u002Fspan><span class=\"i18n-ar\">التدريب مدفوع؟<\u002Fspan><\u002Fsummary>\n        <p>\n          <span class=\"i18n-en\">Yes. Every accepted intern receives a monthly stipend for all 3 months. We never accept unpaid interns.<\u002Fspan>\n          <span class=\"i18n-ar\">أيوة. كل متدرب مقبول بياخد مكافأة شهرية طول الـ3 شهور. مفيش تدريب من غير مقابل عندنا أبداً.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary><span class=\"i18n-en\">Is the program remote or on-site?<\u002Fspan><span class=\"i18n-ar\">حضوري ولا أونلاين؟<\u002Fspan><\u002Fsummary>\n        <p>\n          <span class=\"i18n-en\">On-site at our Cairo office. The rotation model only works when you're in the room with the team.<\u002Fspan>\n          <span class=\"i18n-ar\">حضوري في مقرنا بالقاهرة. نظام التدوير ده مبيشتغلش غير وأنت في الأوضة مع الفريق.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary><span class=\"i18n-en\">When does the next cohort start?<\u002Fspan><span class=\"i18n-ar\">امتى بتبدأ الدفعة الجاية؟<\u002Fspan><\u002Fsummary>\n        <p>\n          <span class=\"i18n-en\">We run two cohorts a year — one in spring and one in autumn. Apply any time; we'll match you to the next one.<\u002Fspan>\n          <span class=\"i18n-ar\">عندنا دفعتين في السنة — واحدة الربيع وواحدة الخريف. قدّم في أي وقت وهنحطّك في أقرب دفعة.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary><span class=\"i18n-en\">Do I need an agency background?<\u002Fspan><span class=\"i18n-ar\">لازم خبرة في وكالات؟<\u002Fspan><\u002Fsummary>\n        <p>\n          <span class=\"i18n-en\">No. We hire on portfolio, taste, and how you think — not where you've worked. Many of our best alumni came from outside marketing.<\u002Fspan>\n          <span class=\"i18n-ar\">لأ. بنوظّف بناءً على البورتفوليو، الذوق، وطريقة التفكير — مش على فين اشتغلت قبل كده. أحسن خريجينا جم من خارج التسويق أصلاً.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary><span class=\"i18n-en\">What happens after the 3 months?<\u002Fspan><span class=\"i18n-ar\">إيه اللي بيحصل بعد الـ3 شهور؟<\u002Fspan><\u002Fsummary>\n        <p>\n          <span class=\"i18n-en\">Around 70% of interns are offered a full-time role. The rest leave with a strong portfolio, references, and our active recommendations.<\u002Fspan>\n          <span class=\"i18n-ar\">حوالي 70% من المتدربين بناخدهم فل تايم. الباقي بيخرج ببورتفوليو قوي، مراجع، وتوصياتنا الفعّالة.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ APPLY CTA ============ -->\n<section class=\"intern-cta\" id=\"apply\">\n  <div class=\"container\">\n    <div class=\"opt-box\">\n      <span class=\"eyebrow\">\n        <span class=\"i18n-en\">Apply<\u002Fspan>\n        <span class=\"i18n-ar\">قدّم<\u002Fspan>\n      <\u002Fspan>\n      <h2 style=\"margin-top:14px;\">\n        <span class=\"i18n-en\">Ready to <span class=\"opt-grad-text\">start strong?<\u002Fspan><\u002Fspan>\n        <span class=\"i18n-ar\">جاهز <span class=\"opt-grad-text\">تبدأ قوي؟<\u002Fspan><\u002Fspan>\n      <\u002Fh2>\n      <p class=\"lede\">\n        <span class=\"i18n-en\">Send us your portfolio (or anything you've made) and a short note. We read every application within 5 business days.<\u002Fspan>\n        <span class=\"i18n-ar\">ابعتلنا بورتفوليو (أو أي حاجة عملتها) وملاحظة قصيرة. بنقرأ كل تقديم خلال 5 أيام عمل.<\u002Fspan>\n      <\u002Fp>\n      <div class=\"intern-cta-btns\">\n        <a href=\"Careers.html#apply\" class=\"btn btn-primary\">\n          <span class=\"i18n-en\">Apply to the Growth Internship<\u002Fspan>\n          <span class=\"i18n-ar\">قدّم لتدريب النمو<\u002Fspan>\n          <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fa>\n        <a href=\"Careers.html\" class=\"btn btn-ghost\">\n          <span class=\"i18n-en\">See full-time roles instead<\u002Fspan>\n          <span class=\"i18n-ar\">شوف وظائف فل تايم بدلاً من ذلك<\u002Fspan>\n          <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<script>\n// Theme + lang + mobile menu toggles\n(function () {\n  var themeBtn = document.getElementById('themeToggle');\n  if (themeBtn) themeBtn.addEventListener('click', function () {\n    var cur = document.documentElement.getAttribute('data-theme') || 'dark';\n    var next = cur === 'dark' ? 'light' : 'dark';\n    document.documentElement.setAttribute('data-theme', next);\n    try { localStorage.setItem('opt_theme', next); } catch (e) {}\n  });\n  var langBtn = document.getElementById('langToggle');\n  if (langBtn) langBtn.addEventListener('click', function () {\n    var cur = document.documentElement.getAttribute('lang') || 'en';\n    var next = cur === 'ar' ? 'en' : 'ar';\n    document.documentElement.setAttribute('lang', next);\n    document.documentElement.setAttribute('dir', next === 'ar' ? 'rtl' : 'ltr');\n    try { localStorage.setItem('opt_lang', next); } catch (e) {}\n  });\n  var open  = document.getElementById('menuOpen');\n  var close = document.getElementById('menuClose');\n  var menu  = document.getElementById('mobileMenu');\n  if (open && menu)  open.addEventListener('click', function () { menu.classList.add('open'); });\n  if (close && menu) close.addEventListener('click', function () { menu.classList.remove('open'); });\n})();\n<\u002Fscript>\n<script src=\"82d35cf3-5f46-44ab-8af0-51db3b01570b\" defer=\"\"><\u002Fscript>\n<script src=\"f9db1378-b4c6-414a-a5a3-8c685b134358\" defer=\"\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
